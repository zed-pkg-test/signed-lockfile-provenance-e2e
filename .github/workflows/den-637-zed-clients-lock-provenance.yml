name: DEN-637 zed-clients resolver provenance

on:
  pull_request:
    paths:
      - '.github/workflows/den-637-zed-clients-lock-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-packer-fingerprint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HISTORICAL_ZED_CLI_VERSION: v0.1.0
      HISTORICAL_ZED_CLI_COMMIT: 751358fe130e64b646844bc7d857c4cff215ca2d
      HISTORICAL_ZED_CLI_LINUX_GNU_SHA256: 1d4ae91cefda505aa70401be2cf86181c91f2476123789e190be989acdde54c1
      ZED_INTERFACES_TAG_COMMIT: 5394b2e7b070354ee79a4c6ac79c26d6264970cd
      ZED_INTERFACES_REGISTRY_SHA256: a2b695d68ac469941d465b0bb78dd191e65e7480412ad7e1ba28aaf0534b7ba4
    steps:
      - name: Checkout exact zed-interfaces release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_TAG_COMMIT }}
          persist-credentials: false

      - name: Install tag-era released zed-cli
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zed-v010.tar.gz"
          mkdir -p "$RUNNER_TEMP/zed-v010-bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            -o "$archive" \
            "https://github.com/zed-pkg/zed-cli/releases/download/${HISTORICAL_ZED_CLI_VERSION}/zed-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$HISTORICAL_ZED_CLI_LINUX_GNU_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/zed-v010-bin"
          zed_bin="$(find "$RUNNER_TEMP/zed-v010-bin" -type f -name zed -perm -u+x -print -quit)"
          test -n "$zed_bin"
          "$zed_bin" --version
          printf 'HISTORICAL_ZED_BIN=%s\n' "$zed_bin" >> "$GITHUB_ENV"

      - name: Fingerprint tag-era packer output
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/zed-interfaces-v010-pack"
          rm -rf "$out"
          mkdir -p "$out"
          "$HISTORICAL_ZED_BIN" pack --out "$out"
          archive="$(find "$out" -maxdepth 1 -type f -name 'zed-interfaces-0.1.0.tar.gz' -print -quit)"
          test -n "$archive"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          printf 'registry-selected digest: %s\ntag-era packer digest: %s\n' \
            "$ZED_INTERFACES_REGISTRY_SHA256" "$actual"
          printf '%s\n' "$actual" > "$RUNNER_TEMP/tag-era-digest.txt"
          if [[ "$actual" == "$ZED_INTERFACES_REGISTRY_SHA256" ]]; then
            printf 'MATCH: registry metadata is reproducible with tag-era zed-cli %s (%s)\n' \
              "$HISTORICAL_ZED_CLI_VERSION" "$HISTORICAL_ZED_CLI_COMMIT"
          else
            printf 'NO_MATCH: registry metadata was not produced by exact tagged source plus tag-era released zed-cli %s (%s)\n' \
              "$HISTORICAL_ZED_CLI_VERSION" "$HISTORICAL_ZED_CLI_COMMIT" >&2
            exit 1
          fi

      - name: Upload historical packer fingerprint
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zed-interfaces-v010-packer-fingerprint-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: ${{ runner.temp }}/tag-era-digest.txt

  resolve-zed-clients-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ZED_CLI_VERSION: v0.3.0
      ZED_CLI_COMMIT: b38a1edd2ca7852bc81ad2e01e2989f44009e93e
      ZED_CLI_LINUX_GNU_SHA256: f87576bc289e43ed647902527e7be70566445d2f1fd11249f067ab35547d4b8a
      ZED_CLIENTS_HEAD: 4f1fa65a2c49cedb3d4a665f980a213ee4a73491
      ZED_INTERFACES_TAG: v0.1.0
      ZED_INTERFACES_TAG_COMMIT: 5394b2e7b070354ee79a4c6ac79c26d6264970cd
      ZED_INTERFACES_REGISTRY_SHA256: a2b695d68ac469941d465b0bb78dd191e65e7480412ad7e1ba28aaf0534b7ba4
    steps:
      - name: Checkout canary
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Checkout exact zed-clients candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-clients
          ref: ${{ env.ZED_CLIENTS_HEAD }}
          path: candidate
          persist-credentials: false

      - name: Checkout exact zed-interfaces release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: zed-pkg/zed-interfaces
          ref: ${{ env.ZED_INTERFACES_TAG_COMMIT }}
          path: dependency-source
          persist-credentials: false

      - name: Install exact released zed-cli
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/zed.tar.gz"
          mkdir -p "$RUNNER_TEMP/zed-bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --retry 3 --retry-all-errors \
            -o "$archive" \
            "https://github.com/zed-pkg/zed-cli/releases/download/${ZED_CLI_VERSION}/zed-x86_64-unknown-linux-gnu.tar.gz"
          printf '%s  %s\n' "$ZED_CLI_LINUX_GNU_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/zed-bin"
          zed_bin="$(find "$RUNNER_TEMP/zed-bin" -type f -name zed -perm -u+x -print -quit)"
          test -n "$zed_bin"
          "$zed_bin" --version
          printf 'ZED_BIN=%s\n' "$zed_bin" >> "$GITHUB_ENV"

      - name: Repack exact dependency source and compare registry digest
        working-directory: dependency-source
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/zed-interfaces-pack"
          rm -rf "$out"
          mkdir -p "$out"
          "$ZED_BIN" pack --out "$out"
          archive="$(find "$out" -maxdepth 1 -type f -name 'zed-interfaces-0.1.0.tar.gz' -print -quit)"
          test -n "$archive"
          actual="$(sha256sum "$archive" | awk '{print $1}')"
          printf 'registry-selected digest: %s\nrepacked tagged-source digest: %s\n' \
            "$ZED_INTERFACES_REGISTRY_SHA256" "$actual"
          printf '%s  %s\n' "$actual" "$(basename "$archive")" > ../dependency-source-SHA256SUMS
          test "$actual" = "$ZED_INTERFACES_REGISTRY_SHA256"

      - name: Verify authored dependency and historical placeholder
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, tomllib
          manifest = tomllib.loads(pathlib.Path('.zpkg.toml').read_text())
          lock = tomllib.loads(pathlib.Path('.zpkg.lock').read_text())
          assert manifest.get('dependencies', {}).get('zed-pkg/zed-interfaces') == '^0.1.0'
          assert lock.get('version') == 1
          assert not lock.get('package'), 'candidate no longer has the expected placeholder lock; update this canary'
          PY

      - name: Resolve from authored manifest with exact released CLI
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .zpkg.lock "$RUNNER_TEMP/placeholder.zpkg.lock"
          rm .zpkg.lock
          "$ZED_BIN" install
          test -s .zpkg.lock
          "$ZED_BIN" validate --require-lock

      - name: Require immutable zed-interfaces provenance
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, tomllib
          lock = tomllib.loads(pathlib.Path('.zpkg.lock').read_text())
          entries = lock.get('package', [])
          matches = [p for p in entries if p.get('org') == 'zed-pkg' and p.get('name') == 'zed-interfaces']
          assert len(matches) == 1, f'expected one zed-pkg/zed-interfaces lock record, got {len(matches)}'
          p = matches[0]
          required = ('org','name','version','sha256','size','format','vcs_tag','vcs_commit','source')
          missing = [k for k in required if k not in p or p[k] in ('', None)]
          assert not missing, f'missing immutable provenance: {missing}'
          assert p['version'] == '0.1.0', p['version']
          assert p['sha256'] == 'a2b695d68ac469941d465b0bb78dd191e65e7480412ad7e1ba28aaf0534b7ba4', p['sha256']
          assert p['vcs_tag'] == 'v0.1.0', p['vcs_tag']
          assert p['vcs_commit'] == '5394b2e7b070354ee79a4c6ac79c26d6264970cd', p['vcs_commit']
          receipt = {
            'schema': 1,
            'zed_cli': {
              'version': 'v0.3.0',
              'commit': 'b38a1edd2ca7852bc81ad2e01e2989f44009e93e',
              'linux_gnu_sha256': 'f87576bc289e43ed647902527e7be70566445d2f1fd11249f067ab35547d4b8a',
            },
            'zed_clients_head': '4f1fa65a2c49cedb3d4a665f980a213ee4a73491',
            'resolved_dependency': {k: p[k] for k in required},
          }
          pathlib.Path('../resolver-receipt.json').write_text(json.dumps(receipt, indent=2, sort_keys=True) + '\n')
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Upload resolver-produced lock and bounded receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zed-clients-resolver-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            candidate/.zpkg.lock
            resolver-receipt.json
            dependency-source-SHA256SUMS
